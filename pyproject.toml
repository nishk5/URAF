[project]
name = "uraf"
version = "0.3.0"
description = "Unified Reasoning and Aggregation Framework - Cutting-edge LLM evaluation with AI agency"
authors = [{name = "URAF Contributors", email = "your.email@example.com"}]
license = {text = "MIT"}
readme = "README_UPDATED.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "loguru>=0.7.2",
    "pyyaml>=6.0.1",
    "evaluate>=0.4.1",
    "sentence-transformers>=2.2.2",
    "guidance>=0.1.8",
    "pandas>=2.2.3",
    "requests>=2.32.3",
    "openai>=1.61.0",
    "langchain>=0.3.17",
    "tqdm>=4.64.1",
    "numpy>=1.23.0,<2.0.0",
    "flashtext>=2.7",
    "keybert>=0.7.0",
    "datasets>=3.2.0",
    "bertopic>=0.15.0",
    "umap-learn>=0.5.3",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.3.0",
    "rouge-score>=0.1.2",
    "asyncio>=3.4.3",
    "aiohttp>=3.11.11",
    "chromadb>=0.4.22",
    "tenacity>=8.2.3",
    "scipy>=1.11.4",
    "matplotlib>=3.8.2",
    "seaborn>=0.13.0",
    "tiktoken>=0.5.2",
    "anthropic>=0.18.0",
    "instructor>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.2.0",
    "ipython>=8.0",
    "python-dotenv>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/your-repo/URAF"
Repository = "https://github.com/your-repo/URAF"
Documentation = "https://github.com/your-repo/URAF#readme"
Issues = "https://github.com/your-repo/URAF/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # Allow raising exceptions without from e
    "UP007", # Use X | Y for type annotations (not ready yet)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/**/*.py" = ["ARG", "S101"]  # Allow assert statements in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "asyncio: mark test as async",
    "slow: mark test as slow",
    "integration: mark test as integration test",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["uraf"]
omit = ["tests/*", "**/__pycache__/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
